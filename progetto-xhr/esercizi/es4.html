<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Es.4 - send() con POST</title>
</head>
<body>
<h1>POST con corpo JSON</h1>
<button id="btn">Invia POST</button>
<pre id="output"></pre>

<script>
document.getElementById('btn').addEventListener('click', function () {
  const output = document.getElementById('output');

  const xhr = new XMLHttpRequest();
  xhr.open('POST', 'https://jsonplaceholder.typicode.com/posts', true);
  // setRequestHeader() va chiamato dopo open() e prima di send()
  xhr.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');

  xhr.onload = function () {
    if (xhr.status === 201) {
      const risposta = JSON.parse(xhr.responseText);
      console.log('Risposta server:', risposta);
      output.textContent = 'Creato (201):\n' + JSON.stringify(risposta, null, 2);
    } else {
      output.textContent = 'Errore HTTP: ' + xhr.status;
    }
  };
  xhr.onerror = function () {
    output.textContent = 'Errore di rete';
  };

  xhr.send(JSON.stringify({
    title: 'Esercitazione XHR',
    body: 'Contenuto inviato',
    userId: 1
  }));
});
</script>
</body>
</html>
