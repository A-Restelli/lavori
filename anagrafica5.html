<!doctype html>
<html lang="it">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <title>Anagrafica 4</title>
        <link rel = "stylesheet" href = "style.css">
    </head>
    <body>
        <h1>Inserisci anagrafica utente</h1>
        
        <form action="destinatarioCreaTabella.html" method="get">
            <div class="grid">
                <div>
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" type="text" autocomplete="given-name" placeholder="Es. Mario" />
                </div>

                <div>
                    <label for="cognome">Cognome</label>
                    <input id="cognome" name="cognome" type="text" autocomplete="family-name" placeholder="Es. Rossi" />
                </div>

                <div style="grid-column:1 / -1">
                    <label for="indirizzo">Indirizzo</label>
                    <input id="indirizzo" name="indirizzo" type="text" placeholder="Via ..., civico" autocomplete="street-address" />
                </div>

                <div>
                    <label for="citta">Città</label>
                    <input id="citta" name="citta" type="text" autocomplete="address-level2" placeholder="Es. Milano" />
                </div>

                <div>
                    <label for="cap">CAP</label>
                    <input id="cap" name="cap" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Es. 20100" />
                </div>

                <div>
                    <label for="dataNascita">Data di nascita</label>
                    <input id="dataNascita" name="dataNascita" type="date" />
                </div>

                <div>
                    <legend>Sesso</legend>
                    <label><input type="radio" name="sesso" value="M"> M</label>
                    <label><input type="radio" name="sesso" value="F"> F</label>
                    <label><input type="radio" name="sesso" value="Altro"> Altro</label>
                </div>

                <div>
                    <label for="provincia">Provincia</label>
                    <select id="provincia" name="provincia">
                        <option value="">-- Seleziona --</option>
                        <option value="MI">Milano</option>
                        <option value="RM">Roma</option>
                        <option value="NA">Napoli</option>
                        <option value="TO">Torino</option>
                        <option value="PA">Palermo</option>
                        <option value="BO">Bologna</option>
                        <option value="FI">Firenze</option>
                        <option value="VE">Venezia</option>
                        <option value="GE">Genova</option>
                        <option value="BA">Bari</option>
                    </select>
                </div>

                <div style="grid-column:1 / -1">
                    <legend>Mezzi di locomozione posseduti in famiglia</legend>
                    <label><input type="checkbox" name="mezzi" value="Auto"> Auto</label>
                    <label><input type="checkbox" name="mezzi" value="Moto"> Moto</label>
                    <label><input type="checkbox" name="mezzi" value="Bici"> Bici</label>
                    <label><input type="checkbox" name="mezzi" value="Aereo"> Aereo</label>
                    <label><input type="checkbox" name="mezzi" value="Yacht"> Yacht</label>
                    <label><input type="checkbox" name="mezzi" value="Camper"> Camper</label>
                    <label><input type="checkbox" name="mezzi" value="Monopattino"> Monopattino</label>
                </div>

                <div style="grid-column:1 / -1">
                    <label for="materie">Materie di insegnamento preferite (max 3)</label>
                    <select id="materie" name="materie" multiple size="5">
                        <option value="Matematica">Matematica</option>
                        <option value="Telecomunicazioni">Telecomunicazioni</option>
                        <option value="TPS">TPS</option>
                        <option value="Informatica">Informatica</option>
                        <option value="Letteratura">Letteratura</option>
                        <option value="Storia">Storia</option>
                        <option value="Educazione Fisica">Educazione Fisica</option>
                        <option value="Inglese">Inglese</option>
                        <option value="Religione">Religione</option>
                    </select>
                </div>

                <div style="grid-column:1 / -1">
                        <label for="note">Note (opzionale)</label>
                        <textarea id="note" name="note" placeholder="Eventuali note"></textarea>
                </div>

                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" placeholder="3-16 caratteri"/>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Minimo 8 caratteri"/>
                </div>

                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" placeholder="esempio@dominio.ext"/>
                </div>

                <div class="row" style="margin-top:12px">
                    <button type="button" id="salvaBtn" onclick="aggiungi()">Salva persona</button>
                </div>

                <div class="row" style="margin-top:12px">
                    <button type="submit" id="salvaBtn2" onclick="trasmetti()">Trasmetti persone</button> 
                </div>
            </div>
        </form>

        <script>

            let persone=[];

            function elaboraGenerazione(anno) {
                if(anno == null || anno < 1901) {
                    return "non determinato";
                } else if(anno <= 1927) {
                    return "Greatest Generation";
                } else if(anno <= 1945) {
                    return "Generazione Silenziosa";
                } else if(anno <= 1964) {
                    return "Baby Boomers";
                } else if(anno <= 1980) {
                    return "Generazione X";
                } else if(anno <= 1996) {
                    return "Millennials";
                } else if(anno <= 2012) {
                    return "Generazione Z";
                }  else {
                    return "Generazione Alpha";
                }
                
            }

            function elaboraSesso(sesso) {
                for(let i = 0; i < sesso.length; i++) {
                    if(sesso[i].checked) {
                        return sesso[i].value;
                    }
                }
            }

            function elaboraProvincia(provincia) {
                provincia = provincia.options[provincia.selectedIndex].text;
                return provincia;
            }

            function elaboraMezzi(mezzi) {
                let selezionati = [];
                for (let i = 0; i < mezzi.length; i++) {
                  if (mezzi[i].checked) {
                      selezionati.push(mezzi[i].value);
                    }
                }
                if(selezionati.length == 0) {
                    return "Nessuno";
                } else{
                    return selezionati;
                }
            }

            function elaboraMaterie(materie) {
                let selezione = []
                for(let i = 0; i < materie.length; i++) {
                    if(materie[i].selected) {
                        selezione.push(materie[i].value);
                    }
                    if(selezione.length == 3) {break;}
                }
                return selezione;
            }

            function aggiungi() {
                const persona = {
                    nome : document.getElementById("nome").value,
                    cognome : document.getElementById("cognome").value,
                    indirizzo : document.getElementById("indirizzo").value,
                    citta : document.getElementById("citta").value,
                    cap : document.getElementById("cap").value,
                    anno : elaboraGenerazione(parseInt(document.getElementById("dataNascita").value.slice(0,4), 10)),
                    sesso : elaboraSesso(document.getElementsByName("sesso")),
                    provincia : elaboraProvincia(document.getElementById("provincia")),
                    mezzi : elaboraMezzi(document.getElementsByName("mezzi")),
                    materie : elaboraMaterie(document.getElementById("materie").options),
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value,
                    email: document.getElementById("email").value
                };

                if(verifica(persona)){
                    persone.push(persona);
                    localStorage.setItem("persone", JSON.stringify(persone));
                    document.querySelector("form").reset();
                }
            }

            function verifica(p) {
                let v = true;
                reNome = /^([A-Z])([a-z]+)$/;
                reCAP = /^\d{5}$/;
                reUser = /[A-Za-z0-9!@#\$%\^&\*\-_.]{3,16}$/;
                rePass = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*\W).{8,}$/;
                reMail = /^([a-zA-Z0-9_.-])+@(([a-zA-Z0-9-]{2,})+\.)+([a-zA-Z0-9]{2,})+$/

                if(!reNome.test(p.nome)) {
                    alert("il nome deve iniziare con la maiuscola e contenere solo lettere");
                    v = false;
                }
                if(!reNome.test(p.cognome)) {
                    alert("il cognome deve iniziare con la maiuscola e contenere solo lettere");
                    v = false;
                }
                if(!reCAP.test(p.cap)) {
                    alert("il CAP deve contenere solo 5 numeri");
                    v = false;
                }
                if(!reUser.test(p.username)) {
                    alert("lo username deve contere almeno 3 caratteri e massimo 16, può contere lettere maiuscole, minuscole numeri e i carattteri: ! @ # \$ % \^ & \* \- _ .");
                    v = false;
                }
                if(!rePass.test(p.password)) {
                    alert("la password deve essere lunga almeno 8 caratteri, contenere almeno una lettere minuscola, una maiuscoa, un numero, e un caratttere speciale");
                    v = false;
                }
                if(!reMail.test(p.email)) {
                    alert("la email deve essere scritta nella forma: esempio@dominio.ext");
                    v = false;
                }

                return v;
            }

            function trasmetti() {
                localStorage.setItem("persone", JSON.stringify(persone));
            }
        </script>
    </body>

</html>
